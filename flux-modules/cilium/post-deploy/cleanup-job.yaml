apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: post-cilium-hook
rules:
  # Permission to get the DaemonSet named 'cilium'
  # Note: For a ClusterRole, resourceNames applies to the named resource in any namespace
  # where this role is bound.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["cilium"]
    verbs: ["get"]

  # Permission to get all CiliumEndpoint objects in all namespaces
  # Ensure 'cilium.io' is the correct API group for your CiliumEndpoint CRDs.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints"]
    verbs: ["get", "list", "watch"]

  # Permission to get all Pods in all namespaces
  - apiGroups: [""] # Core API group
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Permission to delete any Pod in any namespace
  - apiGroups: [""] # Core API group
    resources: ["pods"]
    verbs: ["delete"]

  # Permission to read cilium-operator logs, to detect an operator that started before the
  # Gateway API CRDs were present (its Gateway API controller stays disabled for its lifetime)
  - apiGroups: [""] # Core API group
    resources: ["pods/log"]
    verbs: ["get"]

  # Permission to check whether the Gateway API CRDs are installed at all, so the operator
  # check above stays a no-op on clusters that don't use Gateway API
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["gateways.gateway.networking.k8s.io"]
    verbs: ["get"]

  # Permission to delete the DaemonSet named 'kube-flannel-ds'
  # Similar to the 'cilium' DaemonSet, resourceNames applies to 'kube-flannel-ds'
  # in any namespace where this role is bound.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["kube-flannel-ds", "kube-proxy"]
    verbs: ["get", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: post-cilium-hook-sa
  namespace: kube-system # Or any other namespace where your Job will run
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: post-cilium-hook-binding
subjects:
  - kind: ServiceAccount
    name: post-cilium-hook-sa
    namespace: kube-system # Must match the ServiceAccount's namespace
roleRef:
  kind: ClusterRole
  name: post-cilium-hook # Name of the ClusterRole defined above
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restart-pods-after-cilium-ready
  namespace: kube-system
spec:
  ttlSecondsAfterFinished: 600
  completions: 1
  parallelism: 1
  template:
    spec:
      serviceAccountName: post-cilium-hook-sa
      restartPolicy: Never # required for the feature
      containers:
        - name: sh
          image: docker.io/bitnami/kubectl@sha256:e3753513d7e4eb98777db09886810710c24f58bdee0dd30e41d3a2aa728c343e
          imagePullPolicy: IfNotPresent
          command: # The jobs fails as there is at least one failed index
            # (all even indexes fail in here), yet all indexes
            # are executed as maxFailedIndexes is not exceeded.
            - bash
            - -c
            - |
              set -e
              CILIUM_PODS=$(kubectl -n kube-system get ds cilium -o jsonpath="{.status.numberReady}")
              if [[ $CILIUM_PODS -lt 1 ]]; then
              	echo "Cilium pods not running, exiting"
              	exit 1
              fi

              # Build comparable namespace/name lists without relying on extra tools in the image.
              function all_ceps { kubectl get cep --all-namespaces -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'; }
              function all_pods { kubectl get pods --all-namespaces --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase,HOSTNETWORK:.spec.hostNetwork | awk '($3=="Running" || $3=="Pending") && $4 != "true" { print $1 "/" $2 }'; }
              pods_to_restart=$(sort <(all_ceps) <(all_pods) | uniq -u)

              if [[ $pods_to_restart != "" ]]; then
                echo "Restarting pods"
                for np in $pods_to_restart; do
                	ns="${np%/*}"
                	pod="${np#*/}"
                	echo "Restarting pod: $ns/$pod"
                	kubectl -n "$ns" delete pod "$pod"
                done
              else
              	echo "All pods already running with cilium"
              	if kubectl -n kube-system get ds kube-flannel-ds >/dev/null; then
              		echo "Deleting flannel deamon set"
              		kubectl -n kube-system delete ds kube-flannel-ds
              		echo "Deleting kube-proxy deamon set"
              		kubectl -n kube-system delete ds kube-proxy
              	fi
              fi

              # Cilium probes the Gateway API CRDs only at startup: an operator that started
              # before they existed (or before they gained a required version) keeps its Gateway
              # API controller - and with it Gateway TLS secret-sync - disabled for its whole
              # life, which silently breaks HTTPS on every Gateway listener. Restart any operator
              # that says so. Guarded on the CRDs being installed now, so removing the
              # gateway-api-crds module can't turn this into an hourly restart loop.
              # ponytail: matches the operator's own log line; if cilium rewords it this check
              # goes quiet (no false restarts, just no auto-heal) - re-grep a fresh operator log.
              if kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1; then
              	for p in $(kubectl -n kube-system get pod -l io.cilium/app=operator -o name); do
              		if kubectl -n kube-system logs "$p" | grep -q "Required GatewayAPI resources are not found"; then
              			echo "Operator $p started without the Gateway API CRDs; deleting it so it restarts with them"
              			# Delete the pod, not 'rollout restart': operator anti-affinity is
              			# requiredDuringScheduling with 2 replicas on 2 nodes, so a surge rollout deadlocks.
              			kubectl -n kube-system delete "$p"
              		fi
              	done
              fi
              echo "All done"
