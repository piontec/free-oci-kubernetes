apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-post-deploy
  namespace: flux-system
spec:
  interval: 1h
  # The hook Job's spec.template is immutable, so script changes must recreate it
  # instead of failing the apply and wedging this Kustomization.
  force: true
  path: ./flux-modules/cilium/post-deploy
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
